<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050814">
<title>错词本 · 抢词房</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="nav.css">
<style>
.page-container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 40px 20px;
  min-height: 100vh;
}
.page-title {
  font-size: 36px;
  font-weight: 700;
  text-align: center;
  margin-bottom: 10px;
  background: linear-gradient(135deg, #22d3ee, #38bdf8);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.page-subtitle {
  text-align: center;
  color: rgba(238,243,255,0.6);
  margin-bottom: 40px;
}
.words-container {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 20px;
}
.word-card {
  background: linear-gradient(135deg, rgba(15,21,57,0.95), rgba(8,14,40,0.95));
  border: 1px solid rgba(56,189,248,0.3);
  border-radius: 16px;
  padding: 20px;
  transition: all 0.3s;
}
.word-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 10px 30px rgba(56,189,248,0.3);
  border-color: #22d3ee;
}
.word-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 12px;
}
.word-en {
  font-size: 24px;
  font-weight: 700;
  color: #22d3ee;
}
.word-count {
  background: rgba(239,68,68,0.2);
  border: 1px solid rgba(239,68,68,0.5);
  color: #fca5a5;
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 600;
}
.word-zh {
  font-size: 16px;
  color: #eef3ff;
  margin-bottom: 12px;
  line-height: 1.6;
}
.word-actions {
  display: flex;
  gap: 10px;
  margin-top: 16px;
}
.btn-master {
  flex: 1;
  padding: 8px;
  border: 1px solid rgba(34,197,94,0.5);
  background: rgba(34,197,94,0.1);
  color: #86efac;
  border-radius: 8px;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.3s;
}
.btn-master:hover {
  background: rgba(34,197,94,0.2);
  border-color: #22c55e;
}
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: rgba(238,243,255,0.6);
}
.empty-state-icon {
  font-size: 64px;
  margin-bottom: 20px;
}
</style>
</head>
<body>

<nav class="navbar">
  <div class="nav-left">
    <span class="nav-logo">抢词房</span>
  </div>
  <div class="nav-center">
    <a href="/" class="nav-link">游戏</a>
    <a href="/leaderboard.html" class="nav-link">排行榜</a>
    <a href="/words.html" class="nav-link active">错词本</a>
    <a href="/profile.html" class="nav-link">我的</a>
  </div>
  <div class="nav-right">
    <div class="user-info">
      <img class="user-avatar" id="user-avatar" src="" alt="">
      <div class="user-details">
        <div class="user-name" id="user-name">--</div>
        <div class="user-rank" id="user-rank">--</div>
      </div>
    </div>
    <button class="btn-logout" id="btn-logout">退出</button>
  </div>
</nav>

<div class="page-container">
  <h1 class="page-title">📚 我的错词本</h1>
  <p class="page-subtitle" id="subtitle">加载中...</p>
  
  <div class="words-container" id="words-container"></div>
</div>

<script src="auth.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const container = $('#words-container');
const subtitle = $('#subtitle');

if (api.isLoggedIn() && AUTH.user) {
  $('#user-name').textContent = AUTH.user.username;
  $('#user-rank').textContent = AUTH.user.rank;
  $('#user-avatar').src = AUTH.user.avatar;
  $('#btn-logout').addEventListener('click', () => {
    if (confirm('确定退出？')) api.logout();
  });
} else {
  location.href = '/login.html';
}

async function loadWords() {
  try {
    const data = await api.getWrongWords(false);
    const words = data.words;
    
    subtitle.textContent = `共 ${words.length} 个单词待复习`;
    
    if (words.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="empty-state-icon">🎉</div>
          <h3>太棒了！</h3>
          <p>你的错词本是空的</p>
          <p style="margin-top:10px"><a href="/" style="color:#22d3ee">去玩游戏</a></p>
        </div>
      `;
      return;
    }
    
    container.innerHTML = words.map(word => `
      <div class="word-card" data-word="${word.word}">
        <div class="word-header">
          <div class="word-en">${word.word}</div>
          <div class="word-count">错 ${word.wrongCount} 次</div>
        </div>
        <div class="word-zh">${word.translation}</div>
        <div class="word-actions">
          <button class="btn-master" onclick="markMastered('${word.word}')">
            ✓ 已掌握
          </button>
        </div>
      </div>
    `).join('');
    
  } catch (err) {
    container.innerHTML = `<div class="empty-state"><p style="color:#fca5a5">加载失败：${err.message}</p></div>`;
  }
}

window.markMastered = async function(word) {
  if (!confirm(`确定已掌握「${word}」？`)) return;
  
  try {
    await api.markWordMastered(word);
    const card = document.querySelector(`[data-word="${word}"]`);
    if (card) {
      card.style.opacity = '0';
      setTimeout(() => {
        card.remove();
        const remaining = container.querySelectorAll('.word-card').length;
        subtitle.textContent = `共 ${remaining} 个单词待复习`;
        if (remaining === 0) loadWords();
      }, 300);
    }
  } catch (err) {
    alert('操作失败：' + err.message);
  }
};

loadWords();
</script>

</body>
</html>
