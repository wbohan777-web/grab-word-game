<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050814">
<title>排行榜 · 抢词房</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="nav.css">
<style>
.page-container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 40px 20px;
  min-height: 100vh;
}
.page-title {
  font-size: 36px;
  font-weight: 700;
  text-align: center;
  margin-bottom: 10px;
  background: linear-gradient(135deg, #22d3ee, #38bdf8);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.page-subtitle {
  text-align: center;
  color: rgba(238,243,255,0.6);
  margin-bottom: 40px;
}
.leaderboard {
  background: linear-gradient(135deg, rgba(15,21,57,0.95), rgba(8,14,40,0.95));
  border: 1px solid rgba(56,189,248,0.3);
  border-radius: 20px;
  padding: 30px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.8);
}
.leaderboard-item {
  display: flex;
  align-items: center;
  padding: 16px;
  border-radius: 12px;
  margin-bottom: 12px;
  background: rgba(30,42,85,0.3);
  border: 1px solid transparent;
  transition: all 0.3s;
}
.leaderboard-item:hover {
  background: rgba(30,42,85,0.5);
  border-color: rgba(56,189,248,0.3);
  transform: translateX(4px);
}
.leaderboard-item.me {
  background: linear-gradient(135deg, rgba(34,211,238,0.2), rgba(56,189,248,0.2));
  border-color: #22d3ee;
}
.rank-badge {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: 700;
  margin-right: 16px;
  flex-shrink: 0;
}
.rank-1 {
  background: linear-gradient(135deg, #fbbf24, #f59e0b);
  color: #78350f;
  box-shadow: 0 0 20px rgba(251,191,36,0.5);
}
.rank-2 {
  background: linear-gradient(135deg, #d1d5db, #9ca3af);
  color: #1f2937;
}
.rank-3 {
  background: linear-gradient(135deg, #fb923c, #f97316);
  color: #7c2d12;
}
.rank-normal {
  background: rgba(30,42,85,0.8);
  color: #38bdf8;
  border: 1px solid rgba(56,189,248,0.3);
}
.player-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  margin-right: 12px;
  border: 2px solid #22d3ee;
}
.player-info {
  flex: 1;
}
.player-name {
  font-size: 16px;
  font-weight: 600;
  color: #eef3ff;
  margin-bottom: 4px;
}
.player-stats {
  font-size: 13px;
  color: rgba(238,243,255,0.6);
}
.player-rank {
  font-size: 14px;
  font-weight: 600;
  color: #22d3ee;
  margin-right: 20px;
}
.player-rating {
  font-size: 20px;
  font-weight: 700;
  color: #fbbf24;
}
.loading {
  text-align: center;
  padding: 40px;
  color: rgba(238,243,255,0.6);
}
.error {
  text-align: center;
  padding: 40px;
  color: #fca5a5;
}
</style>
</head>
<body>

<nav class="navbar">
  <div class="nav-left">
    <span class="nav-logo">抢词房</span>
  </div>
  <div class="nav-center">
    <a href="/" class="nav-link">游戏</a>
    <a href="/leaderboard.html" class="nav-link active">排行榜</a>
    <a href="/words.html" class="nav-link">错词本</a>
    <a href="/profile.html" class="nav-link">我的</a>
  </div>
  <div class="nav-right">
    <div class="user-info" id="user-info">
      <img class="user-avatar" id="user-avatar" src="" alt="">
      <div class="user-details">
        <div class="user-name" id="user-name">--</div>
        <div class="user-rank" id="user-rank">--</div>
      </div>
    </div>
    <button class="btn-logout" id="btn-logout">退出</button>
  </div>
</nav>

<div class="page-container">
  <h1 class="page-title">🏆 全球排行榜</h1>
  <p class="page-subtitle">展示全球前 100 名玩家</p>
  
  <div class="leaderboard">
    <div id="leaderboard-content" class="loading">加载中...</div>
  </div>
</div>

<script src="auth.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const content = $('#leaderboard-content');

// 初始化导航栏
if (api.isLoggedIn() && AUTH.user) {
  $('#user-name').textContent = AUTH.user.username;
  $('#user-rank').textContent = AUTH.user.rank;
  $('#user-avatar').src = AUTH.user.avatar;
  $('#btn-logout').addEventListener('click', () => {
    if (confirm('确定退出？')) api.logout();
  });
} else {
  location.href = '/login.html';
}

// 加载排行榜
(async function loadLeaderboard() {
  try {
    const data = await api.getLeaderboard(100);
    const leaderboard = data.leaderboard;
    
    if (!leaderboard || leaderboard.length === 0) {
      content.innerHTML = '<div class="error">暂无排行数据</div>';
      return;
    }
    
    const myId = AUTH.user?._id || AUTH.user?.id;
    
    content.innerHTML = leaderboard.map((player, index) => {
      const rank = index + 1;
      const isMe = player._id === myId || player.id === myId;
      const winRate = player.totalGames > 0 
        ? (player.wins / player.totalGames * 100).toFixed(1) 
        : 0;
      
      let rankClass = 'rank-normal';
      if (rank === 1) rankClass = 'rank-1';
      else if (rank === 2) rankClass = 'rank-2';
      else if (rank === 3) rankClass = 'rank-3';
      
      return `
        <div class="leaderboard-item ${isMe ? 'me' : ''}">
          <div class="rank-badge ${rankClass}">${rank}</div>
          <img class="player-avatar" src="${player.avatar}" alt="">
          <div class="player-info">
            <div class="player-name">${player.username} ${isMe ? '(我)' : ''}</div>
            <div class="player-stats">${player.wins} 胜 · ${player.totalGames} 场 · 胜率 ${winRate}%</div>
          </div>
          <div class="player-rank">${player.rank}</div>
          <div class="player-rating">${player.rating}</div>
        </div>
      `;
    }).join('');
    
  } catch (err) {
    content.innerHTML = `<div class="error">加载失败：${err.message}</div>`;
  }
})();
</script>

</body>
</html>
