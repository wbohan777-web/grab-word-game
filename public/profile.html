<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050814">
<title>个人中心 · 抢词房</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="nav.css">
<style>
.page-container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 40px 20px;
  min-height: 100vh;
}
.profile-header {
  text-align: center;
  padding: 40px 20px;
  background: linear-gradient(135deg, rgba(15,21,57,0.95), rgba(8,14,40,0.95));
  border: 1px solid rgba(56,189,248,0.3);
  border-radius: 20px;
  margin-bottom: 30px;
}
.profile-avatar {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  border: 3px solid #22d3ee;
  margin-bottom: 16px;
  box-shadow: 0 0 30px rgba(34,211,238,0.5);
}
.profile-name {
  font-size: 28px;
  font-weight: 700;
  color: #eef3ff;
  margin-bottom: 8px;
}
.profile-rank {
  font-size: 18px;
  color: #22d3ee;
  font-weight: 600;
  margin-bottom: 4px;
}
.profile-rating {
  font-size: 32px;
  font-weight: 700;
  color: #fbbf24;
  margin-top: 12px;
}
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
  margin-bottom: 30px;
}
.stat-card {
  background: linear-gradient(135deg, rgba(15,21,57,0.95), rgba(8,14,40,0.95));
  border: 1px solid rgba(56,189,248,0.3);
  border-radius: 16px;
  padding: 24px;
  text-align: center;
}
.stat-value {
  font-size: 32px;
  font-weight: 700;
  color: #22d3ee;
  margin-bottom: 8px;
}
.stat-label {
  font-size: 14px;
  color: rgba(238,243,255,0.6);
}
.section-title {
  font-size: 24px;
  font-weight: 700;
  color: #eef3ff;
  margin-bottom: 20px;
  padding-left: 12px;
  border-left: 4px solid #22d3ee;
}
.history-list {
  background: linear-gradient(135deg, rgba(15,21,57,0.95), rgba(8,14,40,0.95));
  border: 1px solid rgba(56,189,248,0.3);
  border-radius: 16px;
  padding: 20px;
}
.history-item {
  padding: 16px;
  border-bottom: 1px solid rgba(56,189,248,0.2);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.history-item:last-child {
  border-bottom: none;
}
.history-result {
  font-size: 14px;
  color: rgba(238,243,255,0.8);
}
.history-date {
  font-size: 12px;
  color: rgba(238,243,255,0.5);
}
.win { color: #86efac; }
.lose { color: #fca5a5; }
</style>
</head>
<body>

<nav class="navbar">
  <div class="nav-left">
    <span class="nav-logo">抢词房</span>
  </div>
  <div class="nav-center">
    <a href="/" class="nav-link">游戏</a>
    <a href="/leaderboard.html" class="nav-link">排行榜</a>
    <a href="/words.html" class="nav-link">错词本</a>
    <a href="/profile.html" class="nav-link active">我的</a>
  </div>
  <div class="nav-right">
    <button class="btn-logout" id="btn-logout">退出</button>
  </div>
</nav>

<div class="page-container">
  <div class="profile-header" id="profile-header">
    <div style="color:rgba(238,243,255,0.6)">加载中...</div>
  </div>
  
  <div class="stats-grid" id="stats-grid"></div>
  
  <h2 class="section-title">📊 最近对局</h2>
  <div class="history-list" id="history-list">
    <div style="text-align:center;color:rgba(238,243,255,0.6);padding:20px">加载中...</div>
  </div>
</div>

<script src="auth.js"></script>
<script>
const $ = (s) => document.querySelector(s);

if (!api.isLoggedIn()) {
  location.href = '/login.html';
}

$('#btn-logout').addEventListener('click', () => {
  if (confirm('确定退出？')) api.logout();
});

async function loadProfile() {
  try {
    const profile = await api.getProfile();
    
    $('#profile-header').innerHTML = `
      <img class="profile-avatar" src="${profile.avatar}" alt="">
      <div class="profile-name">${profile.username}</div>
      <div class="profile-rank">${profile.rank}</div>
      <div class="profile-rating">${profile.rating} 分</div>
      <div style="margin-top:8px;color:rgba(238,243,255,0.6);font-size:14px">全球排名 #${profile.globalRank || '---'}</div>
    `;
    
    $('#stats-grid').innerHTML = `
      <div class="stat-card">
        <div class="stat-value">${profile.wins}</div>
        <div class="stat-label">胜场</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">${profile.totalGames}</div>
        <div class="stat-label">总场次</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">${profile.winRate}%</div>
        <div class="stat-label">胜率</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">${profile.streak}</div>
        <div class="stat-label">连胜</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">${profile.maxStreak}</div>
        <div class="stat-label">最高连胜</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">${profile.totalSteals}</div>
        <div class="stat-label">翻盘次数</div>
      </div>
    `;
    
    // 加载游戏历史
    const history = await api.getGameHistory(10);
    if (history.history && history.history.length > 0) {
      $('#history-list').innerHTML = history.history.map(game => {
        const myPlayer = game.players.find(p => p.userId === profile.id);
        const isWin = myPlayer && myPlayer.position === 1;
        const date = new Date(game.createdAt).toLocaleString('zh-CN');
        
        return `
          <div class="history-item">
            <div class="history-result">
              <span class="${isWin ? 'win' : 'lose'}">${isWin ? '胜利' : '失败'}</span>
              · 第 ${myPlayer?.position || '?'} 名 · ${myPlayer?.score || 0} 分
            </div>
            <div class="history-date">${date}</div>
          </div>
        `;
      }).join('');
    } else {
      $('#history-list').innerHTML = '<div style="text-align:center;color:rgba(238,243,255,0.6);padding:20px">暂无对局记录</div>';
    }
    
  } catch (err) {
    $('#profile-header').innerHTML = `<div style="color:#fca5a5">加载失败：${err.message}</div>`;
  }
}

loadProfile();
</script>

</body>
</html>
